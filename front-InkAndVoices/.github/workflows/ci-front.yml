name: CI-front

on:
  pull_request:
    branches: 
      - dev

jobs:
  tests_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./front-InkAndVoices
      
      - name: Run tests
        run: npm run test
        working-directory: ./front-InkAndVoices